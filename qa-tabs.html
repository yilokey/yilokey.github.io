<!DOCTYPE html>
<html lang="tr">
<head><meta charset="utf-8"><title>QA Tabs</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0f12}iframe{width:100vw;height:100vh;border:0;display:block}</style>
</head>
<body>
<iframe id="f" src="index.html"></iframe>
<script>
  var tab = new URLSearchParams(location.search).get('tab') || 'play';
  var f = document.getElementById('f');
  f.addEventListener('load', function () {
    try { f.contentDocument.querySelector('.navbtn[data-tab="' + tab + '"]').click(); } catch (e) {}
  });
</script>
</body>
</html>
